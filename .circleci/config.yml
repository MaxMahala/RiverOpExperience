version: 2.1
jobs:

  appstore_submit:
    macos:
      xcode: 26.4.0
    resource_class: m4pro.medium
    environment:
      FL_OUTPUT_DIR: output
      FASTLANE_LANE: appstore_submit
    steps:
      - checkout
      - run: bundle install
      - run:
          name: Fastlane
          command: bundle exec fastlane $FASTLANE_LANE

workflows:
  submit:
    jobs:
      - appstore_submit:
          filters:
            branches:
              only: appstore
